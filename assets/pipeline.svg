<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Autopsy pipeline</title>
  <desc id="d">Messy CSV or XLSX flows through ingest and preflight, the replay engine, repair operators, scoring and global assignment, which feeds the cheapest-check recommender, hotspot analysis, and the narrator and dashboard.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .h{font-size:16px;font-weight:700;fill:#eaf1f8}
    .s{font-size:12.5px;fill:#93a7bd}
    .n{font-size:13px;font-weight:800;fill:#0e1724;text-anchor:middle}
    .box{fill:#1a2638;stroke:#2a3b54;stroke-width:1.5}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#93a7bd"/>
    </marker>
  </defs>
  <rect width="1200" height="410" rx="18" fill="#101a2a"/>

  <!-- input -->
  <rect x="45" y="26" width="190" height="36" rx="18" fill="#1a2638" stroke="#2a3b54" stroke-width="1.5"/>
  <text x="140" y="49" class="sans" font-size="14" font-weight="600" fill="#eaf1f8" text-anchor="middle">messy CSV / XLSX</text>
  <path d="M140 63V96" stroke="#93a7bd" stroke-width="2" marker-end="url(#a)"/>

  <!-- stages -->
  <g class="sans">
    <rect class="box" x="45" y="100" width="190" height="130" rx="12"/>
    <circle cx="67" cy="124" r="13" fill="#6ea8fe"/><text class="n" x="67" y="129">1</text>
    <text class="h" x="61" y="162">Ingest + preflight</text>
    <text class="s" x="61" y="184">tier detection, drops,</text><text class="s" x="61" y="201">warnings, column</text><text class="s" x="61" y="218">auto-mapping</text>

    <rect class="box" x="275" y="100" width="190" height="130" rx="12"/>
    <circle cx="297" cy="124" r="13" fill="#6ea8fe"/><text class="n" x="297" y="129">2</text>
    <text class="h" x="291" y="162">Replay engine</text>
    <text class="s" x="291" y="184">expected vs counted,</text><text class="s" x="291" y="201">gap per item, location,</text><text class="s" x="291" y="218">and window</text>

    <rect class="box" x="505" y="100" width="190" height="130" rx="12"/>
    <circle cx="527" cy="124" r="13" fill="#ffb454"/><text class="n" x="527" y="129">3</text>
    <text class="h" x="521" y="162">Repair operators</text>
    <text class="s" x="521" y="184">one candidate ledger</text><text class="s" x="521" y="201">edit per cause,</text><text class="s" x="521" y="218">verified by replay</text>

    <rect class="box" x="735" y="100" width="190" height="130" rx="12"/>
    <circle cx="757" cy="124" r="13" fill="#ffb454"/><text class="n" x="757" y="129">4</text>
    <text class="h" x="751" y="162">Scoring</text>
    <text class="s" x="751" y="184">prior × likelihood ratio</text><text class="s" x="751" y="201">with a chance model</text>

    <rect class="box" x="965" y="100" width="190" height="130" rx="12"/>
    <circle cx="987" cy="124" r="13" fill="#3ddc97"/><text class="n" x="987" y="129">5</text>
    <text class="h" x="981" y="162">Global assignment</text>
    <text class="s" x="981" y="184">ILP selects one coherent</text><text class="s" x="981" y="201">repair set; abstains</text><text class="s" x="981" y="218">when unsure</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#93a7bd" stroke-width="2" fill="none">
    <path d="M237 165H271" marker-end="url(#a)"/>
    <path d="M467 165H501" marker-end="url(#a)"/>
    <path d="M697 165H731" marker-end="url(#a)"/>
    <path d="M927 165H961" marker-end="url(#a)"/>
    <path d="M1060 232V262M750 262H1080"/>
    <path d="M750 262V296" marker-end="url(#a)"/>
    <path d="M915 262V296" marker-end="url(#a)"/>
    <path d="M1080 262V296" marker-end="url(#a)"/>
  </g>

  <!-- outputs -->
  <g class="sans" font-size="13.5" font-weight="600" fill="#eaf1f8" text-anchor="middle">
    <rect x="675" y="300" width="150" height="56" rx="28" fill="#1a2638" stroke="#3ddc97" stroke-width="1.5"/>
    <text x="750" y="324">Cheapest-check</text><text x="750" y="341">recommender</text>
    <rect x="840" y="300" width="150" height="56" rx="28" fill="#1a2638" stroke="#3ddc97" stroke-width="1.5"/>
    <text x="915" y="333">Hotspot analysis</text>
    <rect x="1005" y="300" width="150" height="56" rx="28" fill="#1a2638" stroke="#3ddc97" stroke-width="1.5"/>
    <text x="1080" y="324">Narrator +</text><text x="1080" y="341">dashboard</text>
  </g>

  <!-- callout -->
  <g class="sans">
    <rect x="45" y="290" width="570" height="88" rx="12" fill="#0b121d" stroke="#2a3b54" stroke-width="1.5"/>
    <rect x="45" y="290" width="5" height="88" rx="2.5" fill="#3ddc97"/>
    <text x="70" y="318" font-size="15" font-weight="700" fill="#3ddc97">Ledger-edit-or-die</text>
    <text x="70" y="341" font-size="13.5" fill="#c9d6e4">Every cause is an explicit edit that must close the gap on replay.</text>
    <text x="70" y="362" font-size="13.5" fill="#c9d6e4">Low confidence or a near-tie means Autopsy abstains.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
