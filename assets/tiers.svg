<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 330" width="1160" height="330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Data tiers</title>
  <desc id="d">Three cumulative data tiers. Tier 0 needs counts and a basic movement log. Tier 1 adds worker, shift and document numbers. Tier 2 adds an item master with cost, pack size, group and zone.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .t{font-size:21px;font-weight:800;fill:#eaf1f8}
    .d{font-size:13px;fill:#93a7bd}
    .l{font-size:12.5px;font-weight:700;fill:#93a7bd}
    .i{font-size:14.5px;fill:#eaf1f8}
  </style>
  <rect width="1160" height="330" rx="18" fill="#101a2a"/>
  <g class="sans">
    <!-- Tier 0 -->
    <rect x="20" y="90" width="350" height="220" rx="14" fill="#1a2638" stroke="#2a3b54" stroke-width="1.5"/>
    <rect x="20" y="90" width="6" height="220" rx="3" fill="#6ea8fe"/>
    <text class="t" x="46" y="126">Tier 0</text>
    <text class="d" x="46" y="150">Counts + basic movement log</text>
    <path d="M46 164H346" stroke="#2a3b54"/>
    <text class="l" x="46" y="188">Unlocks</text>
    <g fill="#6ea8fe"><circle cx="52" cy="206" r="3.5"/><circle cx="52" cy="230" r="3.5"/><circle cx="52" cy="254" r="3.5"/><circle cx="52" cy="278" r="3.5"/></g>
    <text class="i" x="66" y="211">Replay and gap detection</text>
    <text class="i" x="66" y="235">Duplicates and missed scans</text>
    <text class="i" x="66" y="259">Typos and miscounts</text>
    <text class="i" x="66" y="283">Shrink</text>

    <!-- Tier 1 -->
    <rect x="405" y="55" width="350" height="255" rx="14" fill="#1a2638" stroke="#2a3b54" stroke-width="1.5"/>
    <rect x="405" y="55" width="6" height="255" rx="3" fill="#ffb454"/>
    <text class="t" x="431" y="91">Tier 1</text>
    <text class="d" x="431" y="115">Adds worker, shift, doc numbers</text>
    <path d="M431 129H731" stroke="#2a3b54"/>
    <text class="l" x="431" y="153">Unlocks, on top of Tier 0</text>
    <g fill="#ffb454"><circle cx="437" cy="171" r="3.5"/><circle cx="437" cy="195" r="3.5"/><circle cx="437" cy="219" r="3.5"/></g>
    <text class="i" x="451" y="176">Doc-sequence evidence</text>
    <text class="i" x="451" y="200">Worker and shift priors</text>
    <text class="i" x="451" y="224">Worker and shift hotspots</text>

    <!-- Tier 2 -->
    <rect x="790" y="20" width="350" height="290" rx="14" fill="#1a2638" stroke="#2a3b54" stroke-width="1.5"/>
    <rect x="790" y="20" width="6" height="290" rx="3" fill="#3ddc97"/>
    <text class="t" x="816" y="56">Tier 2</text>
    <text class="d" x="816" y="80">Adds item master: cost, pack size, group, zone</text>
    <path d="M816 94H1116" stroke="#2a3b54"/>
    <text class="l" x="816" y="118">Unlocks, on top of Tier 1</text>
    <g fill="#3ddc97"><circle cx="822" cy="136" r="3.5"/><circle cx="822" cy="160" r="3.5"/><circle cx="822" cy="184" r="3.5"/></g>
    <text class="i" x="836" y="141">Unit-mismatch repair</text>
    <text class="i" x="836" y="165">Value at risk in dollars</text>
    <text class="i" x="836" y="189">Richer pair matching</text>
    <path d="M816 212H1116" stroke="#2a3b54" stroke-dasharray="4 5"/>
    <text class="d" x="816" y="238">Without it, value at risk is blank and</text>
    <text class="d" x="816" y="257">ranking falls back to units, clearly labeled.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
