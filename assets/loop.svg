<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 270" width="1160" height="270" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">The ledger-edit-or-die loop</title>
  <desc id="d">A hypothesis is applied as a ledger edit and the window is replayed. If the gap closes within 1e-6 the hypothesis survives to scoring; otherwise it is discarded.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .h{font-size:16px;font-weight:700;fill:#eaf1f8}
    .s{font-size:12.5px;fill:#93a7bd}
    .box{fill:#1a2638;stroke:#2a3b54;stroke-width:1.5}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a7bd"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3ddc97"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker>
  </defs>
  <rect width="1160" height="270" rx="18" fill="#101a2a"/>
  <g class="sans">
    <rect class="box" x="30" y="60" width="180" height="80" rx="12"/>
    <text class="h" x="46" y="92">Hypothesis</text>
    <text class="s" x="46" y="112">a cause plus a</text><text class="s" x="46" y="128">candidate edit</text>

    <rect class="box" x="250" y="60" width="180" height="80" rx="12"/>
    <text class="h" x="266" y="92">Apply the edit</text>
    <text class="s" x="266" y="112">delete, insert, set,</text><text class="s" x="266" y="128">swap, or book a loss</text>

    <rect class="box" x="470" y="60" width="180" height="80" rx="12"/>
    <text class="h" x="486" y="92">Replay the window</text>
    <text class="s" x="486" y="112">recompute expected</text><text class="s" x="486" y="128">vs counted</text>

    <path d="M800 45L910 100L800 155L690 100Z" fill="#1a2638" stroke="#ffb454" stroke-width="2"/>
    <text x="800" y="96" font-size="14" font-weight="700" fill="#eaf1f8" text-anchor="middle">Gap closes</text>
    <text x="800" y="115" font-size="14" font-weight="700" fill="#ffb454" text-anchor="middle">within 1e-6?</text>

    <rect x="970" y="60" width="160" height="80" rx="12" fill="#12291f" stroke="#3ddc97" stroke-width="1.5"/>
    <text class="h" x="986" y="92" style="fill:#3ddc97">Survives</text>
    <text class="s" x="986" y="112">goes on to scoring</text>

    <rect x="710" y="190" width="180" height="56" rx="12" fill="#2b1620" stroke="#ff6b6b" stroke-width="1.5"/>
    <text class="h" x="726" y="214" style="fill:#ff6b6b">Dead</text>
    <text class="s" x="726" y="232">no vibes-based diagnoses</text>

    <text x="940" y="90" font-size="13" font-weight="700" fill="#3ddc97" text-anchor="middle">yes</text>
    <text x="816" y="178" font-size="13" font-weight="700" fill="#ff6b6b">no</text>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M212 100H246" stroke="#93a7bd" marker-end="url(#a)"/>
    <path d="M432 100H466" stroke="#93a7bd" marker-end="url(#a)"/>
    <path d="M652 100H686" stroke="#93a7bd" marker-end="url(#a)"/>
    <path d="M912 100H966" stroke="#3ddc97" marker-end="url(#g)"/>
    <path d="M800 157V186" stroke="#ff6b6b" marker-end="url(#r)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
