<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Autopsy</title>
  <desc id="d">Explain every stock discrepancy with evidence, not guesses. A ledger shows a gap of minus 100 closing to zero after correcting one quantity typo.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16243a"/>
      <stop offset="1" stop-color="#0e1724"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <!-- ledger ruling -->
  <g stroke="#1f2f46" stroke-width="1">
    <path d="M0 52H1200M0 104H1200M0 156H1200M0 208H1200M0 260H1200M0 312H1200"/>
  </g>
  <path d="M44 0V330" stroke="#3a2230" stroke-width="2"/>

  <text x="80" y="150" class="sans" font-size="88" font-weight="800" letter-spacing="-3" fill="#eaf1f8">Autopsy</text>
  <text x="82" y="200" class="sans" font-size="28" font-weight="600" fill="#eaf1f8">Explain every stock discrepancy</text>
  <text x="82" y="236" class="sans" font-size="28" font-weight="600" fill="#3ddc97">with evidence, not guesses.</text>
  <text x="82" y="282" class="sans" font-size="15" fill="#93a7bd">Replay-verified causes. Calibrated confidence. An honest “I don’t know.”</text>

  <!-- ledger card -->
  <g>
    <rect x="720" y="40" width="430" height="250" rx="14" fill="#0b121d" stroke="#2a3b54" stroke-width="1.5"/>
    <text x="744" y="76" class="mono" font-size="14" fill="#93a7bd">discrepancy D-7f3a91  SKU123 @ B-12</text>
    <path d="M744 90H1126" stroke="#26364d"/>

    <text x="744" y="122" class="mono" font-size="17" fill="#c9d6e4">expected</text>
    <text x="1126" y="122" class="mono" font-size="17" fill="#c9d6e4" text-anchor="end">140</text>
    <text x="744" y="150" class="mono" font-size="17" fill="#c9d6e4">counted</text>
    <text x="1126" y="150" class="mono" font-size="17" fill="#c9d6e4" text-anchor="end">40</text>
    <rect x="736" y="164" width="398" height="34" rx="6" fill="#ff6b6b" fill-opacity="0.13"/>
    <text x="744" y="187" class="mono" font-size="17" font-weight="700" fill="#ff6b6b">gap</text>
    <text x="1126" y="187" class="mono" font-size="17" font-weight="700" fill="#ff6b6b" text-anchor="end">−100</text>

    <path d="M744 214H1126" stroke="#26364d" stroke-dasharray="4 5"/>
    <text x="744" y="240" class="mono" font-size="15" fill="#ffb454">T-8812 qty_delta  110 → 10</text>
    <rect x="736" y="252" width="398" height="30" rx="6" fill="#3ddc97" fill-opacity="0.13"/>
    <text x="744" y="273" class="mono" font-size="15" font-weight="700" fill="#3ddc97">gap after replay</text>
    <text x="1126" y="273" class="mono" font-size="15" font-weight="700" fill="#3ddc97" text-anchor="end">0 ✓</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
